server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20m;
    root /home/ubuntu/club-site;
    index index.html;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /backend/ {
        deny all;
    }

    location /static/ {
        alias /home/ubuntu/club-site/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /home/ubuntu/club-site/backend/media/;
        client_max_body_size 20m;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}